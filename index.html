<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MatArena - Matematik Ustası</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">⚡ Hız + Zeka</p>
          <h1>MatArena</h1>
          <p class="subtitle">Seviyeni seç, kombolarla puan patlat ve matematikte efsane ol.</p>
        </div>
        <div class="hero-badge" aria-hidden="true">∑</div>
      </header>

      <section class="hud" aria-label="Oyun bilgileri">
        <article class="stat-card">
          <h2>Skor</h2>
          <p id="score">0</p>
        </article>
        <article class="stat-card">
          <h2>Süre</h2>
          <p id="time">60</p>
        </article>
        <article class="stat-card">
          <h2>Can</h2>
          <p id="lives">3</p>
        </article>
        <article class="stat-card combo">
          <h2>Kombo</h2>
          <p id="combo">x1</p>
        </article>
      </section>

      <section class="control-panel" aria-label="Oyun ayarları">
        <label for="difficulty">Zorluk</label>
        <select id="difficulty">
          <option value="easy">Kolay</option>
          <option value="medium" selected>Orta</option>
          <option value="hard">Zor</option>
        </select>
        <button id="startBtn">Oyunu Başlat</button>
      </section>

      <section class="game-card" aria-live="polite">
        <p id="status">Hazır mısın? "Oyunu Başlat" tuşuna bas!</p>
        <div id="question" class="question">?</div>
        <form id="answerForm" autocomplete="off">
          <input id="answerInput" type="number" inputmode="numeric" placeholder="Cevabın" disabled />
          <button type="submit" id="submitBtn" disabled>Gönder</button>
        </form>
      </section>

      <section class="leaderboard-card" aria-label="En iyi skorlar">
        <div class="leaderboard-head">
          <h2>🏆 En İyi Skorların</h2>
          <button id="resetScores" class="ghost">Sıfırla</button>
        </div>
        <ol id="leaderboard"></ol>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
